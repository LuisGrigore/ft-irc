name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-tests:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make valgrind

      - name: Configurar CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar el proyecto
        run: cmake --build build

      - name: Ejecutar pruebas unitarias
        run: ctest --test-dir build -L unit --output-on-failure

      - name: Ejecutar pruebas de integracion
        run: ctest --test-dir build -L integration --output-on-failure

  memory-checks:
    name: Comprobaciones de memoria (Valgrind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make valgrind

      - name: Compilar el proyecto en modo Debug
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - name: Ejecutar pruebas con Valgrind
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 \
            build/tests/unit_tests
          valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 \
            build/tests/integration_tests

  sanitizers:
    name: Sanitizadores (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make

      - name: Configurar con sanitizadores habilitados
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON

      - name: Compilar el proyecto
        run: cmake --build build-asan

      - name: Ejecutar todas las pruebas
        run: ctest --test-dir build-asan --output-on-failure
