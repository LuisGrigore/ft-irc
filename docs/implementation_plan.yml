# =============================================================================
# ft_irc — Implementation Plan (single source of truth)
# =============================================================================
# Hierarchy:  features[] -> { acceptance_criteria[], tasks[] }  (ACs hang from features, as in the .md)
#
# Rendering rules for the Markdown generator script:
#   * Any string in `related_elements` ending in ".mmd" is rendered as inline
#     code (`file.mmd`); any other string (e.g. "Subject Chapter IV") is
#     rendered as plain text. Multiple elements are joined with ", ".
#   * Strings may contain inline Markdown (backticks, **bold**); emit as-is.
#   * Section 1 (Features Table)      <- features[*]  (id, name, short_description, related_elements)
#   * Section 2 (Tasks Table)         <- features[*].tasks[*]  (id, description, tdd_step,
#                                         parent feature id, related_elements), in YAML order
#   * Section 3 (Acceptance Criteria) <- features[*].acceptance_criteria[*]
#                                         (id, description, "Associated Element" = parent FEAT id),
#                                         sorted by AC id
#   * Section 4 (Detailed Breakdown)  <- features[*].detailed_description, plus derived values:
#                                         Tasks: first..last task id of the feature
#                                         Acceptance Criteria: first..last AC id of the feature
#                                         Depends on: depends_on joined by ", " ("None" if empty),
#                                         or `depends_on_label` if present
#   * Dependency Summary table        <- features[*].depends_on + dependency_rationale
#                                         "<ids or None> (<dependency_rationale>)", or
#                                         "<depends_on_label> (<dependency_rationale>)" if label present
#   * constraints.items[*]: "- **label**{separator}text" (separator defaults to ": ");
#                           if `items` (list) is given instead of `text`, render each entry as
#                           inline code joined by ", ".
#   * Document order: title, intro/sources, id_prefixes, 1, 2, 3, constraints,
#                     tdd_methodology, 4, dependency summary.
# =============================================================================

document:
  title: Implementation Plan
  intro: "Traceability plan for the **ft_irc** IRC server project, derived from:"
  sources:
    - en.subject.pdf (project requirements, Chapter IV — Mandatory Part)
    - docs/diagrams/class/irc_clients.mmd
    - docs/diagrams/class/irc_network_layer_pull.mmd
    - docs/diagrams/class/irc_commands.mmd
    - docs/diagrams/class/irc_channels.mmd
    - docs/diagrams/class/irc_registration.mmd
    - docs/diagrams/class/irc_robustness.mmd
  id_scheme_intro: "Each element has a unique traceability ID:"
  id_prefixes:
    - prefix: FEAT
      meaning: Independent feature (user-facing capability)
    - prefix: T
      meaning: Task (implementation step, child of a feature)
    - prefix: AC
      meaning: Acceptance criterion (verifiable outcome)

constraints:
  title: Constraints from the Subject (applied to all features)
  items:
    - label: Language
      text: "C++ 98 only (`-std=c++98`, `-Wall -Wextra -Werror`)"
    - label: Executable name
      text: "`ircserv`"
    - label: Arguments
      text: "`./ircserv <port> <password>`"
    - label: Makefile rules
      text: "`NAME`, `all`, `clean`, `fclean`, `re` (no unnecessary relinking)"
    - label: No forking
      text: "all I/O non-blocking; single `poll()` (or equivalent: `select`, `kqueue`, `epoll`)"
      separator: "; "
    - label: No errno-based decisions
      text: "after `read`/`recv`/`write`/`send`"
      separator: " "
    - label: No IRC client
      text: ", **no server-to-server communication**"
      separator: ""
    - label: TCP/IP
      text: "(v4 or v6)"
      separator: " "
    - label: Allowed external functions
      items: [socket, close, setsockopt, getsockname, getprotobyname, gethostbyname, getaddrinfo, freeaddrinfo, bind, connect, listen, accept, htons, htonl, ntohs, ntohl, inet_addr, inet_ntoa, inet_ntop, send, recv, signal, sigaction, sigemptyset, sigfillset, sigaddset, sigdelset, sigismember, lseek, fstat, fcntl, poll]
    - label: Bonus
      text: "(only if mandatory is perfect): file transfer, bot"
      separator: " "
    - label: Build system
      text: "The existing CMake/Makefile infrastructure will be used for development. The subject-compliant Makefile (`NAME`, `all`, `clean`, `fclean`, `re`) will be implemented as FEAT-009 after the core server is functional, and then adjusted to match the 42 guidelines."

tdd_methodology:
  title: TDD Methodology (applied to all tasks)
  intro: "Every task follows the **Test-Driven Development** cycle:"
  steps:
    - name: Red
      description: Write a failing test (unit or integration) that specifies the expected behavior.
    - name: Green
      description: Implement the minimum production code required to make the test pass.
    - name: Refactor
      description: Clean up the code while keeping tests passing; ensure `-Wall -Wextra -Werror -std=c++98` compliance.
  ordering_note: Tasks are ordered so that tests for a feature are written before or alongside the production code they validate.

